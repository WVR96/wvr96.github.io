<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imperial Casino Challenge</title>
<style>
:root{color-scheme:dark;--bg:#0b0d0c;--ink:#f1ead6;--gold:#f3cf6b;--gold2:#d9a935;--mute:#d8cfb8;--glass:rgba(10,12,11,.55);--line:#d9a93599;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bg{--ov:linear-gradient(#0000008a,#000000b0);position:fixed;inset:-50px;z-index:-1;filter:blur(14px) saturate(1.25)}
.bg.b1{background:var(--ov),radial-gradient(circle 9vmax at 12% 22%,#ff2bd6e0 70%,#0000 72%),radial-gradient(circle 13vmax at 30% 72%,#22e6ffd0 70%,#0000 72%),radial-gradient(circle 7vmax at 55% 18%,#ffd23fe0 70%,#0000 72%),radial-gradient(circle 15vmax at 80% 62%,#ff2bd6c0 70%,#0000 72%),radial-gradient(circle 10vmax at 90% 18%,#22e6ffd0 70%,#0000 72%),radial-gradient(circle 14vmax at 48% 95%,#7b2cffd0 70%,#0000 72%),linear-gradient(135deg,#12031f,#06121f)}
.bg.b2{background:var(--ov),radial-gradient(circle 8vmax at 15% 20%,#ffd06bf0 70%,#0000 72%),radial-gradient(circle 5vmax at 28% 40%,#ffe9a8f0 70%,#0000 72%),radial-gradient(circle 11vmax at 50% 15%,#f3b43ad0 70%,#0000 72%),radial-gradient(circle 6vmax at 68% 38%,#ffe9a8f0 70%,#0000 72%),radial-gradient(circle 12vmax at 85% 25%,#d9962ae0 70%,#0000 72%),radial-gradient(circle 14vmax at 30% 85%,#c8791ac0 70%,#0000 72%),radial-gradient(circle 9vmax at 75% 85%,#ffd06bd0 70%,#0000 72%),linear-gradient(160deg,#2b1a08,#120a03)}
.bg.b3{background:var(--ov),radial-gradient(circle 24vmax at 72% 38%,#0000 62%,#d9a935 64% 68%,#0000 70%),repeating-conic-gradient(from 0deg at 72% 38%,#a01820 0 9deg,#0b0b0b 9deg 18deg),#0b0b0b}
.bg.b4{background:var(--ov),radial-gradient(circle 10vmax at 18% 25%,#2fe08ad0 70%,#0000 72%),radial-gradient(circle 14vmax at 45% 75%,#0f9b5ce0 70%,#0000 72%),radial-gradient(circle 7vmax at 62% 20%,#ffd06be0 70%,#0000 72%),radial-gradient(circle 12vmax at 88% 55%,#1ec97ad0 70%,#0000 72%),radial-gradient(circle 8vmax at 8% 80%,#ffd06bd0 70%,#0000 72%),linear-gradient(150deg,#042e1f,#021510)}
.bg.b5{background:var(--ov),radial-gradient(circle 11vmax at 20% 30%,#3a6bffd0 70%,#0000 72%),radial-gradient(circle 8vmax at 40% 12%,#ffd06be0 70%,#0000 72%),radial-gradient(circle 15vmax at 70% 70%,#8a2cffc0 70%,#0000 72%),radial-gradient(circle 7vmax at 88% 20%,#ff3b5ce0 70%,#0000 72%),radial-gradient(circle 9vmax at 12% 85%,#ff3b5cc0 70%,#0000 72%),radial-gradient(circle 6vmax at 55% 50%,#ffd06bd0 70%,#0000 72%),linear-gradient(140deg,#0a0f33,#10071f)}
.wrap{width:100%;max-width:1000px;padding:24px 18px;text-align:center}
.logo{width:92px;height:92px;filter:drop-shadow(0 4px 14px #000a)}
h1{margin:10px 0 6px;font-size:clamp(30px,7vw,60px);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);text-shadow:0 3px 16px #000;line-height:1.1}
.sub{font-size:clamp(15px,2.6vw,20px);color:var(--mute);margin:0 0 34px;text-shadow:0 2px 8px #000}
.sub b{color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:760px){.tiles{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 18px;border:2px solid var(--line);border-radius:20px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);text-decoration:none;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;font:inherit}
.tile:hover,.tile:focus-visible{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 14px 34px #000a,0 0 0 2px var(--gold2);outline:none}
.tile h2{margin:0;font-size:28px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.tile p{margin:0;color:var(--mute);font-size:15px}
.go{margin-top:4px;padding:10px 26px;border-radius:999px;background:linear-gradient(var(--gold),var(--gold2));color:#1d1a14;font-weight:700;letter-spacing:.08em}
.wip{margin-top:4px;padding:8px 18px;border-radius:999px;border:1px dashed var(--line);color:var(--mute);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.tile.soon{opacity:.8}.tile.soon:hover{transform:none;box-shadow:none;border-color:var(--line);cursor:not-allowed}
.art{height:96px;display:flex;align-items:center;justify-content:center}
.pc{width:62px;height:88px;background:#fffdf8;color:#1d1a14;border-radius:8px;box-shadow:0 4px 10px #000a;font:700 22px/1.1 Georgia,serif;padding:6px;text-align:left}
.pc.r{color:#c0262d}
.pc+.pc{margin-left:-14px}.pc:first-child{transform:rotate(-9deg)}.pc:last-child{transform:rotate(9deg)}
.wheel{width:92px;height:92px;border-radius:50%;border:4px solid var(--gold2);background:radial-gradient(circle,var(--gold2) 0 9px,#0000 10px),repeating-conic-gradient(#a01820 0 10deg,#0b0b0b 10deg 20deg);box-shadow:0 4px 14px #000a;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:#000d;border:1px solid var(--gold2);color:var(--gold);padding:12px 22px;border-radius:999px;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="wrap">
<svg class="logo" viewBox="0 0 64 64" aria-label="Imperial crown logo"><circle cx="32" cy="32" r="29" fill="#0e5a3a" stroke="#d9a935" stroke-width="3"/><path d="M14 44 L12 22 L24 31 L32 16 L40 31 L52 22 L50 44 Z" fill="#d9a935" stroke="#f3cf6b" stroke-width="1.5" stroke-linejoin="round"/><rect x="14" y="46" width="36" height="5" rx="2" fill="#d9a935"/><circle cx="12" cy="21" r="3" fill="#f3cf6b"/><circle cx="32" cy="15" r="3" fill="#f3cf6b"/><circle cx="52" cy="21" r="3" fill="#f3cf6b"/></svg>
<h1>Imperial Casino Challenge</h1>
<p class="sub">You have <b>15 minutes</b>. Pick a game and make as much virtual money as you can.</p>
<div class="tiles">
<a class="tile" href="https://claude.ai/artifact/D4zCxECqm77UQQCh8ExcMR" target="_blank" rel="noopener">
<div class="art"><div class="pc">A<br>♠</div><div class="pc r">K<br>♥</div></div>
<h2>Blackjack</h2><p>Beat the dealer to 21. Blackjack pays 3 to 2.</p><span class="go">PLAY NOW</span>
</a>
<button class="tile soon" data-g="Baccarat">
<div class="art"><div class="pc r">9<br>♦</div><div class="pc">K<br>♣</div></div>
<h2>Baccarat</h2><p>Player, Banker or Tie. Closest to 9 wins.</p><span class="wip">Work in progress</span>
</button>
<button class="tile soon" data-g="Roulette">
<div class="art"><div class="wheel"></div></div>
<h2>Roulette</h2><p>Place your chips and spin the wheel.</p><span class="wip">Work in progress</span>
</button>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
document.getElementById('bg').className='bg b'+(1+Math.floor(Math.random()*5));
let tm;
document.querySelectorAll('.soon').forEach(b=>b.onclick=()=>{
 const t=document.getElementById('toast');t.textContent=b.dataset.g+' is a work in progress – coming soon';t.classList.add('on');
 clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),2200)});
</script>
</body>
</html>
